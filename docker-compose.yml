services:
  postgres:
    image: postgres:16
    container_name: andeth3d-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: andeth3d
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: andeth3d
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
